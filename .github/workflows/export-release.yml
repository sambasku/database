name: Export & Release Dataset

# Maintainer: Actions → Export & Release Dataset → Run workflow
#
# Secrets org (prioritas, shared semua repo DB):
#   DB_STAGING_TURSO_URL / DB_STAGING_TURSO_AUTH_TOKEN
#   DB_PRODUCTION_TURSO_URL / DB_PRODUCTION_TURSO_AUTH_TOKEN
# Fallback repo lama: DATABASE_URL / DATABASE_AUTH_TOKEN
# (Nama *_TURSO_* = libSQL; host boleh sqld self-host.)
#
# Skip Release baru jika sha256 sama dengan metadata/active.json (QUESTIONS G.34).

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'release_version (kosong = active + 1)'
        required: false
        type: string
        default: ''
      channel:
        description: 'channel manifest (staging | production)'
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      min_app_version:
        description: 'min_app_version untuk klien'
        required: false
        type: string
        default: '0.1.0'
      allow_empty:
        description: 'Izinkan word_count = 0'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Hanya export + validasi (tanpa Release / commit)'
        required: false
        type: boolean
        default: false
      runner:
        description: 'ubuntu-latest (publik) atau self-hosted (homelab, jika CF blokir GHA)'
        required: false
        type: choice
        options:
          - ubuntu-latest
          - self-hosted
        default: ubuntu-latest

permissions:
  contents: write

concurrency:
  group: dataset-export
  cancel-in-progress: false

jobs:
  export-release:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Resolve DB secrets (org prioritas)
        id: db
        env:
          CHANNEL: ${{ inputs.channel }}
          DB_STAGING_TURSO_URL: ${{ secrets.DB_STAGING_TURSO_URL }}
          DB_STAGING_TURSO_AUTH_TOKEN: ${{ secrets.DB_STAGING_TURSO_AUTH_TOKEN }}
          DB_PRODUCTION_TURSO_URL: ${{ secrets.DB_PRODUCTION_TURSO_URL }}
          DB_PRODUCTION_TURSO_AUTH_TOKEN: ${{ secrets.DB_PRODUCTION_TURSO_AUTH_TOKEN }}
          LEGACY_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LEGACY_DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
        run: |
          if [ "$CHANNEL" = "production" ]; then
            URL="${DB_PRODUCTION_TURSO_URL:-$LEGACY_DATABASE_URL}"
            TOKEN="${DB_PRODUCTION_TURSO_AUTH_TOKEN:-$LEGACY_DATABASE_AUTH_TOKEN}"
            SRC="DB_PRODUCTION_TURSO_*"
          else
            URL="${DB_STAGING_TURSO_URL:-$LEGACY_DATABASE_URL}"
            TOKEN="${DB_STAGING_TURSO_AUTH_TOKEN:-$LEGACY_DATABASE_AUTH_TOKEN}"
            SRC="DB_STAGING_TURSO_*"
          fi

          # Normalisasi: trim, buang kutip, CRLF, pastikan scheme
          URL=$(printf '%s' "$URL" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")

          if [ -z "$URL" ]; then
            echo "::error::Secret DB URL kosong untuk channel=$CHANNEL (set $SRC atau DATABASE_URL di org/repo)"
            exit 1
          fi
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret DB token kosong untuk channel=$CHANNEL (set $SRC atau DATABASE_AUTH_TOKEN di org/repo)"
            exit 1
          fi

          # Deteksi salah isi: URL secret berisi JWT (sering tertukar dengan AUTH_TOKEN)
          if printf '%s' "$URL" | grep -qE '^eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+'; then
            echo "::error::DB_*_TURSO_URL berisi JWT (mirip token). Secret tertukar: URL harus https://host, token di DB_*_TURSO_AUTH_TOKEN."
            exit 1
          fi
          if printf '%s' "$TOKEN" | grep -qiE '^https?://|^libsql://'; then
            echo "::error::DB_*_TURSO_AUTH_TOKEN berisi URL. Secret tertukar: pindahkan URL ke DB_*_TURSO_URL."
            exit 1
          fi

          case "$URL" in
            libsql://*|https://*|http://*|file:*) ;;
            *)
              echo "::notice::URL tanpa scheme - prepend https://"
              URL="https://$URL"
              ;;
          esac

          # libsql client: tolak libsql://https://... (dobel scheme)
          case "$URL" in
            libsql://https://*|libsql://http://*)
              echo "::error::URL dobel scheme (libsql://https://...). Isi secret dengan https://host atau libsql://host saja."
              exit 1
              ;;
          esac

          # Jangan mask URL/host - butuh terlihat di log saat DNS gagal.
          # Token saja yang di-mask.
          echo "::add-mask::$TOKEN"
          # GITHUB_ENV lebih andal daripada outputs untuk secret antar-step
          {
            echo "DATABASE_URL<<EOF"
            echo "$URL"
            echo "EOF"
            echo "DATABASE_AUTH_TOKEN<<EOF"
            echo "$TOKEN"
            echo "EOF"
          } >> "$GITHUB_ENV"
          HOST=$(printf '%s' "$URL" | sed -E 's#^[a-zA-Z][a-zA-Z0-9+.-]*://##' | cut -d/ -f1 | cut -d? -f1)
          echo "db_host=$HOST" >> "$GITHUB_OUTPUT"
          echo "Sumber ($SRC): scheme=$(printf '%s' "$URL" | sed -E 's#://.*##') host=$HOST"

      - name: Preflight DB (TLS + HTTP)
        run: |
          # curl tidak paham scheme libsql:// - map ke https:// untuk smoke TLS
          PREFLIGHT_URL="$DATABASE_URL"
          case "$PREFLIGHT_URL" in
            libsql://*)
              PREFLIGHT_URL="https://${PREFLIGHT_URL#libsql://}"
              ;;
            http://*|https://*|file:*)
              ;;
            *)
              PREFLIGHT_URL="https://$PREFLIGHT_URL"
              ;;
          esac
          case "$PREFLIGHT_URL" in
            file:*)
              echo "Preflight skip (file: lokal)"
              exit 0
              ;;
          esac
          echo "Preflight URL scheme=$(printf '%s' "$PREFLIGHT_URL" | sed -E 's#://.*##') host=$(printf '%s' "$PREFLIGHT_URL" | sed -E 's#^[a-zA-Z][a-zA-Z0-9+.-]*://##' | cut -d/ -f1)"
          set +e
          code=$(curl -sS -o /tmp/db-preflight.body -w '%{http_code}' \
            --connect-timeout 15 --max-time 30 \
            -H "Authorization: Bearer ${DATABASE_AUTH_TOKEN}" \
            -H "User-Agent: sambasku-database-ci/1.0" \
            "${PREFLIGHT_URL}/" )
          curl_ec=$?
          set -e
          echo "preflight curl_exit=${curl_ec} http_code=${code}"
          if [ "$curl_ec" -ne 0 ]; then
            HOST=$(printf '%s' "$PREFLIGHT_URL" | sed -E 's#^[a-zA-Z][a-zA-Z0-9+.-]*://##' | cut -d/ -f1 | cut -d? -f1)
            HOST_LEN=${#HOST}
            echo "host_len=${HOST_LEN} host_prefix=$(printf '%s' "$HOST" | cut -c1-12)"
            if [ "$HOST_LEN" -gt 253 ] || printf '%s' "$HOST" | grep -qE '^eyJ'; then
              echo "::error::Nilai DB_*_TURSO_URL bukan hostname (len=${HOST_LEN}, prefix=$(printf '%s' "$HOST" | cut -c1-8)). Kemungkinan besar JWT tertukar ke field URL. Set URL=https://db-sambasku-staging.iamutaki.com dan token di *_AUTH_TOKEN."
              exit 1
            fi
            echo "DNS dig:"
            dig +short "$HOST" A || true
            dig +short "$HOST" AAAA || true
            if [ "$curl_ec" -eq 6 ]; then
              echo "::error::DNS tidak resolve host=${HOST}. Cek org secret DB_*_TURSO_URL - harus hostname publik (contoh https://db-sambasku-staging.iamutaki.com atau https://data.sambasku.com), bukan Tailscale/LAN/typo/JWT."
            else
              echo "::error::Runner tidak reach host=${HOST} (curl_exit=${curl_ec}). Kalau DNS OK tapi koneksi gagal: CF Bot Fight / pakai runner=self-hosted."
            fi
            exit 1
          fi
          # 401/403/404 di root masih berarti TCP+TLS OK (sqld/CF menjawab)
          echo "Preflight TLS OK (HTTP ${code})"

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - name: Tentukan release_version
        id: ver
        env:
          INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          ACTIVE_V=$(jq -r '.release_version // 0' metadata/active.json)
          if [ -n "$INPUT_RELEASE_VERSION" ]; then
            NEXT="$INPUT_RELEASE_VERSION"
          else
            NEXT=$((ACTIVE_V + 1))
          fi
          echo "release_version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "active_version=$ACTIVE_V" >> "$GITHUB_OUTPUT"
          echo "Release target: v$NEXT (active sekarang: $ACTIVE_V)"

      - name: Export dataset
        env:
          # DATABASE_URL + DATABASE_AUTH_TOKEN dari GITHUB_ENV (step Resolve)
          DATASET_RELEASE_VERSION: ${{ steps.ver.outputs.release_version }}
          DATASET_CHANNEL: ${{ inputs.channel }}
          DATASET_MIN_APP_VERSION: ${{ inputs.min_app_version }}
          DATASET_OUT_DIR: ${{ github.workspace }}/tmp/dataset-export
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL kosong setelah resolve"
            exit 1
          fi
          echo "Export host: $(printf '%s' "$DATABASE_URL" | sed -E 's#^[a-zA-Z][a-zA-Z0-9+.-]*://##' | cut -d/ -f1)"
          pnpm dataset:export

      - name: Baca manifest + gate
        id: manifest
        env:
          ALLOW_EMPTY: ${{ inputs.allow_empty }}
        run: |
          MANIFEST=tmp/dataset-export/manifest.json
          WORD_COUNT=$(jq -r '.word_count' "$MANIFEST")
          SHA=$(jq -r '.database.sha256' "$MANIFEST")
          SIZE=$(jq -r '.database.size' "$MANIFEST")
          RELEASED_AT=$(jq -r '.released_at' "$MANIFEST")
          ACTIVE_SHA=$(jq -r '.database.sha256 // empty' metadata/active.json)

          echo "word_count=$WORD_COUNT" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "released_at=$RELEASED_AT" >> "$GITHUB_OUTPUT"

          echo "word_count=$WORD_COUNT size=$SIZE"
          echo "sha256=$SHA"
          echo "active_sha=$ACTIVE_SHA"

          if [ "$WORD_COUNT" = "0" ] && [ "$ALLOW_EMPTY" != "true" ]; then
            echo "::error::word_count=0 - set allow_empty=true jika memang sengaja"
            exit 1
          fi

          if [ -n "$ACTIVE_SHA" ] && [ "$ACTIVE_SHA" = "$SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::sha256 sama dengan active.json - skip Release (G.34)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifact CI
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dataset-export-v${{ steps.ver.outputs.release_version }}
          path: |
            tmp/dataset-export/database.sqlite.gz
            tmp/dataset-export/manifest.json
            tmp/dataset-export/SHA256SUMS
            out/
          if-no-files-found: warn

      - name: Dry-run selesai
        if: ${{ inputs.dry_run }}
        run: echo "::notice::dry_run=true - tidak membuat Release / commit"

      - name: Skip (sha sama)
        if: ${{ !inputs.dry_run && steps.manifest.outputs.skip == 'true' }}
        run: echo "Tidak ada perubahan konten - selesai tanpa Release."

      - name: Buat GitHub Release
        id: release
        if: ${{ !inputs.dry_run && steps.manifest.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.ver.outputs.release_version }}
          WORD_COUNT: ${{ steps.manifest.outputs.word_count }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG sudah ada (Release imutabel). Naikkan release_version."
            exit 1
          fi

          gh release create "$TAG" \
            tmp/dataset-export/database.sqlite.gz \
            tmp/dataset-export/manifest.json \
            tmp/dataset-export/SHA256SUMS \
            --title "Dataset $TAG" \
            --notes "Public dictionary snapshot ($CHANNEL). word_count=${WORD_COUNT}. schema_version=1."

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Update metadata/active.json
        if: ${{ !inputs.dry_run && steps.manifest.outputs.skip != 'true' }}
        env:
          TAG: v${{ steps.ver.outputs.release_version }}
          REL: ${{ steps.ver.outputs.release_version }}
          SHA: ${{ steps.manifest.outputs.sha256 }}
          SIZE: ${{ steps.manifest.outputs.size }}
          RELEASED_AT: ${{ steps.manifest.outputs.released_at }}
          CHANNEL: ${{ inputs.channel }}
          MIN_APP: ${{ inputs.min_app_version }}
          REPO: ${{ github.repository }}
        run: |
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          jq -n \
            --argjson release_version "$REL" \
            --argjson schema_version 1 \
            --arg min_app_version "$MIN_APP" \
            --arg channel "$CHANNEL" \
            --arg released_at "$RELEASED_AT" \
            --arg file "database.sqlite.gz" \
            --arg url "${BASE}/database.sqlite.gz" \
            --argjson size "$SIZE" \
            --arg sha256 "$SHA" \
            --arg manifest_url "${BASE}/manifest.json" \
            '{
              release_version: $release_version,
              schema_version: $schema_version,
              min_app_version: $min_app_version,
              channel: $channel,
              released_at: $released_at,
              database: {
                file: $file,
                url: $url,
                size: $size,
                sha256: $sha256
              },
              manifest_url: $manifest_url
            }' > metadata/active.json

          cat metadata/active.json

      - name: Commit active.json
        if: ${{ !inputs.dry_run && steps.manifest.outputs.skip != 'true' }}
        env:
          REL: ${{ steps.ver.outputs.release_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata/active.json
          if git diff --staged --quiet; then
            echo "active.json tidak berubah"
            exit 0
          fi
          git commit -m "chore(dataset): point active to v${REL}"
          git push

  notify:
    needs: [export-release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Kirim hasil CI ke Telegram
        uses: appleboy/telegram-action@v1.1.0
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          to: ${{ secrets.TELEGRAM_TO }}
          message: |
            ${{ contains(needs.*.result, 'failure') && '❌ Gagal' || (contains(needs.*.result, 'cancelled') && '⚠️ Dibatalkan' || '✅ Sukses') }} CI sambasku/database — Export & Release Dataset
            Branch: ${{ github.ref_name }} · Commit: ${{ github.sha }}
            https://github.com/sambasku/database/actions/runs/${{ github.run_id }}
      - name: Kirim hasil CI ke Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS: "${{ contains(needs.*.result, 'failure') && '❌ Gagal' || (contains(needs.*.result, 'cancelled') && '⚠️ Dibatalkan' || '✅ Sukses') }}"
          REPO: sambasku/database
          WORKFLOW: Export & Release Dataset
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: "https://github.com/sambasku/database/actions/runs/${{ github.run_id }}"
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Skip: DISCORD_WEBHOOK_URL tidak diset."
            exit 0
          fi
          MSG="$STATUS CI $REPO — $WORKFLOW
          Branch: $BRANCH · Commit: $SHA
          $RUN_URL"
          jq -n --arg content "$MSG" '{content: $content}' \
            | curl -sf -X POST -H 'Content-Type: application/json' \
                -d @- "$DISCORD_WEBHOOK_URL" \
            || echo "Discord webhook gagal (best-effort, job tidak gagal)"
